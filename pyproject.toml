[project]
# PyPI distribution name. The Python import name and CLI binary are still
# `lookback` — only the pip-install handle differs (scikit-learn pattern).
name = "lookback-ai"
version = "0.1.0"
description = "Local-first multimodal semantic memory for your machine — searchable text + screenshots, MCP-native, runs on CPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayush Chaurasia" }]
keywords = [
    "semantic-search",
    "embeddings",
    "lancedb",
    "local-first",
    "mcp",
    "multimodal",
    "mobileclip",
    "nomic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
    "Intended Audience :: Developers",
]

dependencies = [
    "lancedb>=0.16",
    "pyarrow>=17",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pypdf>=4.3",
    "pillow>=10.3",
    "huggingface-hub>=0.24",
    # Real embedders are now the default path. onnxruntime + tokenizers are
    # used by NomicTextEmbedder; MobileCLIPImageEmbedder reuses onnxruntime.
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "fastmcp>=3.3.1",
    "watchfiles>=0.24",
]

[project.scripts]
lookback = "lookback.cli:app"

[project.urls]
Homepage = "https://github.com/AyushExel/lookback"
Source = "https://github.com/AyushExel/lookback"
Issues = "https://github.com/AyushExel/lookback/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookback"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "perf: marks performance smoke tests (run nightly, not by default)",
    "needs_models: marks tests that download/load embedding models",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.flake8-bugbear]
# Typer's API mandates `typer.Option(...)` / `typer.Argument(...)` calls in
# argument defaults; B008 ("don't call functions in arg defaults") is a
# false positive for these specifically.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
]
